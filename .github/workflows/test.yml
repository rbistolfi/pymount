name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      # mount(2) needs CAP_SYS_ADMIN. sudo resets PATH, so call the
      # setup-python interpreter explicitly instead of the system one. A
      # private mount namespace keeps test mounts off the host.
      - run: sudo unshare --mount --propagation private "$(which python)" -m unittest -v test_mount
